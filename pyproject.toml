[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ysmatrix"
dynamic = ["version"]
description = "Unofficial Python library and CLI for YS/TL Bluetooth LED matrix panels (LOY PLAY / LOY SPACE app compatible)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Thorben Grosser" }]
keywords = ["led", "matrix", "bluetooth", "ble", "pixel", "backpack", "loy", "loy play"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Home Automation",
  "Development Status :: 3 - Alpha",
]
dependencies = ["bleak>=0.22", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=7"]
docs = ["mkdocs-material>=9"]

[project.scripts]
ysmatrix = "ysmatrix.cli:main"

[tool.hatch.version]
path = "src/ysmatrix/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ysmatrix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
